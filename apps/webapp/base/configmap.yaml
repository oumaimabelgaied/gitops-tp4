apiVersion: v1
kind: ConfigMap
metadata:
  name: webapp-nginx-conf
data:
  default.conf: |
    server {
      listen 80;
      location / {
        root /usr/share/nginx/html;
        index index.html;
      }
    }
    server {
      listen 8081;
      location /stub_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
      }
    }
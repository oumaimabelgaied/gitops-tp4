apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "93.11.0"
    helm:
      valuesObject:
        # Composants non exposés sur kind : évite de fausses alertes
        kubeEtcd: { enabled: false }
        kubeScheduler: { enabled: false }
        kubeControllerManager: { enabled: false }
        kubeProxy: { enabled: false }
        prometheus:
          prometheusSpec:
            # Prometheus scrape TOUS les ServiceMonitors, pas seulement ceux du chart
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            retention: 2d
            resources:
              requests: { cpu: 100m, memory: 400Mi }
        grafana:
          sidecar:
            dashboards:
              enabled: true
              searchNamespace: ALL
          # Sondes assouplies : Grafana démarre lentement sur kind
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true